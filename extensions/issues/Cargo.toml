[package]
name = "issues"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "rawkode.issues: per-repository issues for Tartan, in Rust as a WebAssembly component"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tartan-ext = { path = "../../sdk/rust/tartan-ext" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
