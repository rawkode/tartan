# The runtime smoke's B2 module: a tiny no-dependency WASM library whose bytes
# the driver uploads to the smoke Worker (`suites/runtime.ts`). Build output
# goes to the shared CARGO_TARGET_DIR and is never committed.
[package]
name = "tartan_smoke_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
